customCommands:
  - key: "C"
    description: Pick AI commit
    command: oco
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  showIcons: true
os:
  edit: 'nvim --server $NVIM --remote-tab "{{filename}}"'
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers
