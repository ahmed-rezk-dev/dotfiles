- clean: ["~"]

- defaults:
    link:
      create: true
      force: true
      relink: true

- link:
    ~/.zshrc: .zshrc
    ~/.antigen.zsh: antigen.zsh
    ~/.config/nvim: nvim
    ~/.config/tmuxinator: tmuxinator
    ~/.config/tmux: tmux
    ~/.config/wezterm/: wezterm
    ~/.config/aerospace/: aerospace
    ~/.config/ghostty/: ghostty
    ~/.config/lazygit/: lazygit
    ~/.config/aichat/: aichat
    ~/.hammerspoon/: hammerspoon
    ~/.config/mcphub: mcphub
    ~/.config/opencode: opencode
    ~/.zshrc.local.example: .zshrc.local.example
    ~/.agents/skills/: agents/skills
    ~/.agents/.skill-lock.json: agents/.skill-lock.json
    ~/.pi/agent/skills/: pi-agent-skills
