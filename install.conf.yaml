- clean: ["~"]

- defaults:
    link:
      create: true
      force: true
      relink: true

- link:
    ~/.zshrc: .zshrc
    ~/.antigen.zsh: antigen.zsh
    ~/.config/nvim: nvim
    ~/.local/bin/newvault: bin/newvault
    ~/.config/tmuxinator: tmuxinator
    ~/.config/tmux: tmux
    ~/.config/wezterm/: wezterm
    ~/.config/aerospace/: aerospace
    ~/.config/ghostty/: ghostty
    ~/.config/lazygit/: lazygit
    ~/.config/aichat/: aichat
    ~/.hammerspoon/: hammerspoon
    ~/.config/starship.toml: starship/starship.toml
    ~/.config/workmux: workmux
    .git/hooks/post-merge: .githooks/update-submodules
    .git/hooks/post-rewrite: .githooks/update-submodules
    ~/.config/opencode: opencode
    ~/.zshrc.local.example: .zshrc.local.example
    ~/.agents/skills/: agents/skills
    ~/.agents/.skill-lock.json: agents/.skill-lock.json
    ~/.agents/prompts/: agents/prompts
    ~/.pi/agent/skills/: pi-agent-skills
    ~/.pi/agent/mcp.json: pi-agent/mcp.json
    ~/.pi/agent/npm/package.json: pi-agent/npm/package.json
    ~/.pi/agent/npm/package-lock.json: pi-agent/npm/package-lock.json
    ~/.omp/agent/mcp.json: omp-agent/mcp.json
    ~/.omp/agent/managed-skills/: omp-agent/managed-skills
    ~/.omp/agent/RULES.md: omp-agent/RULES.md
    ~/.omp/agent/config.yml: omp-agent/config.yml
    ~/.omp/agent/models.yml: omp-agent/models.yml
    ~/.omp/agent/themes/: omp-agent/themes
    ~/.omp/agent/extensions/: omp-agent/extensions
