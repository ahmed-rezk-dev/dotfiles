<!doctype html>
<html lang="en">

    ></script>

    <style type="text/css">
      .window {
        @apply w-80;

      .app {

      }
    </style>

              <p className="text-gray-700 mt-1">{body}</p>
            </div>
          </li>
        );
      };

      // Define the main App component
      const App = () => {

        ];

        return (
          <div className="bg-white rounded shadow-md overflow-hidden">
            {/* List header */}
            <div className="border-b px-3 py-2 flex items-center">
              <input className="flex-1 border rounded px-3 py-2 mr-2" type="text" />
              {/* Add other list header controls here if needed */}
            </div>
            {/* Map data to list items */}
            <ul role="list" aria-label="List" className="divide-y divide-gray-200">
              {items.map((item, index) => (
                <ListItem key={index} title={item.title} body={item.body} active={item.active} />
              ))}

        );
      };

      } catch (err) {

      }

      // Render the App component into the root element
      ReactDOM.render(<App />, document.getElementById('root'));

  </body>
</html>
